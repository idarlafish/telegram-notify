name = "telegram-notify"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

routes = [{ pattern = "telegram-notify.la.fish", custom_domain = true }]

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "telegram_notify_events"

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[[durable_objects.bindings]]
name = "USER_SCHEDULER"
class_name = "UserSchedulerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserSchedulerDO"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[env.staging]
name = "telegram-notify-staging"
routes = [{ pattern = "telegram-notify-staging.la.fish", custom_domain = true }]

[[env.staging.durable_objects.bindings]]
name = "USER_SCHEDULER"
class_name = "UserSchedulerDO"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["UserSchedulerDO"]

[[env.staging.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "telegram_notify_events_staging"

[env.staging.assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[env.staging.rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true
