name = "telegram-notify"
main = "src/index.ts"
compatibility_date = "2026-04-01"
account_id = "95c5c6e1c01ea2d0c9fab69ee9e28462"

routes = [{ pattern = "telegram-notify.la.fish", custom_domain = true }]

# Cron Trigger: scan D1 for due notifications every minute.
[triggers]
crons = ["* * * * *"]

# D1 database binding.
[[d1_databases]]
binding = "DB"
database_name = "telegram-notify-db"
database_id = "d8757e49-34a9-4bb9-b574-5dd53c26a5b6"
migrations_dir = "migrations"

# Bot token + webhook secret are stored as secrets, not in vars.
# Set with: wrangler secret put BOT_TOKEN ; wrangler secret put WEBHOOK_SECRET
# For local dev, copy .dev.vars.example to .dev.vars and fill in.

# React Mini App built by `bun run build` → web/dist/. SPA fallback so
# TanStack Router handles client-side routes (/new, /edit/:id, …).
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
